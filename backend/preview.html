for(const surface of scene.surfaces){if(!visibleSurface(surface))continue;const d=surfaceDisplay(surface);if(surface.kind==='floor'){const hull=convexHull(corners(d.size,d.position,surface.map_from_surface));shadow(hull,floorY-.095,.16,.009);}if(surface.kind==='wall')wall(surface,d);else box(d.size,d.position,surface.map_from_surface,surface.kind==='floor'?'#f4f6f2':'#e9edeb');}
for(const object of scene.objects){const m=object.map_from_object,d=object.measured_dimensions_m;const meshPoints=object.model_meshes?.flatMap(mesh=>mesh.vertices.map(p=>transform(m,p)))||[];const pts=meshPoints.length?meshPoints:object.obstacle_corners;const cast=pts.map(p=>{const rise=Math.max(0,p[1]-floorY);return[p[0]+rise*.24,floorY+.003,p[2]+rise*.15];});shadow(convexHull(cast),floorY+.003,.08,.012);const contact=Array.from({length:40},(_,i)=>transform(m,[Math.cos(i/40*Math.PI*2)*d[0]*.45,-d[1]/2,Math.sin(i/40*Math.PI*2)*d[2]*.45]));shadow(contact,floorY+.006,.045,.014);
if(object.model_meshes?.length)for(const mesh of object.model_meshes){const vertices=mesh.vertices.map(p=>transform(m,p)),normals=mesh.normals.map(p=>rotate(m,p));for(const triangle of mesh.triangles){const world=triangle.map(i=>vertices[i]),normal=cross(sub(world[1],world[0]),sub(world[2],world[0]));if(dot(normal,c.toward)<=0)continue;polygon(world,color(furnitureColor(mesh.color)),1,triangle.map(i=>shade(furnitureColor(mesh.color),normals[i],c.toward)));}}else for(const part of object.parts)box(part.dimensions_m,part.center,m,furnitureColor(part.color));}
if(raw.checked)for(const mesh of scene.meshes)for(const triangle of mesh.triangles)polygon(triangle.map(i=>mesh.vertices[i]),color('#40857d'),.23);
if(navigationDemo){
  const points=navigationDemo.waypoints.map(p=>[p[0],floorY+.028,p[2]]);
  function ribbon(radius,hex,lift){
    for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],dx=b[0]-a[0],dz=b[2]-a[2],length=Math.hypot(dx,dz);if(length<.001)continue;const offset=[-dz/length*radius,0,dx/length*radius];polygon([add(a,offset),add(b,offset),sub(b,offset),sub(a,offset)].map(p=>[p[0],p[1]+lift,p[2]]),color(hex));}
    for(const p of points)polygon(Array.from({length:24},(_,i)=>[p[0]+Math.cos(i/24*Math.PI*2)*radius,p[1]+lift,p[2]+Math.sin(i/24*Math.PI*2)*radius]),color(hex));
  }
  ribbon(.088,'#ffffff',0);ribbon(.057,'#007aff',.002);
}

function render(data,mode,points=false){if(!data.length)return;gl.uniform1i(pointsLocation,points?1:0);gl.uniform1f(pointSizeLocation,3*(window.devicePixelRatio||1));gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);gl.drawArrays(mode,0,data.length/7);}
gl.depthMask(true);render(opaque,gl.TRIANGLES);gl.depthMask(false);render(transparent,gl.TRIANGLES);if(raw.checked){const data=[];for(const p of scene.point_cloud)vertex(data,project(p.position,c),color('#478d7d'));render(data,gl.POINTS,true);}if(bounds.checked){const data=[];for(const object of scene.objects){const pts=object.obstacle_corners.map(p=>project(p,c));for(const[a,b]of edges)for(const p of[pts[a],pts[b]])vertex(data,p,color('#bf8b48'));}gl.disable(gl.DEPTH_TEST);render(data,gl.LINES);gl.enable(gl.DEPTH_TEST);}gl.depthMask(true);$('#needle').style.transform=`rotate(${(yaw-Math.PI)*180/Math.PI}deg)`;layoutNavigation(c);}
function readNavigationDemo(metadata){
  if(!(metadata?.synthetic===true||metadata?.demo_only===true))return;
  const route=metadata.navigation_demo,vector=p=>Array.isArray(p)&&p.length===3&&p.every(Number.isFinite);
  if(!route||!vector(route.current_position)||!vector(route.destination?.position)||typeof route.destination?.name!=='string'||!route.destination.name.trim()||!Array.isArray(route.waypoints)||route.waypoints.length<2||route.waypoints.length>1000||!route.waypoints.every(vector)||!Number.isFinite(route.distance_m)||route.distance_m<=0||!Number.isFinite(route.heading_radians)||!Number.isFinite(route.clearance_m)||route.clearance_m<=0)return;
  const distance=(a,b)=>Math.hypot(...sub(a,b));
  if(distance(route.waypoints[0],route.current_position)>.3||distance(route.waypoints.at(-1),route.destination.position)>.3)return;
  return route;
}
function layoutNavigation(c){
  $('#current-position').hidden=!navigationDemo;$('#destination-marker').hidden=!navigationDemo;
  if(!navigationDemo)return;
  const current=project([navigationDemo.current_position[0],floorY+.07,navigationDemo.current_position[2]],c),destination=project([navigationDemo.destination.position[0],floorY+.08,navigationDemo.destination.position[2]],c);
  $('#current-position').style.left=current[0]+'px';$('#current-position').style.top=current[1]+'px';$('#current-position').style.setProperty('--heading',((navigationDemo.heading_radians-yaw)*180/Math.PI)+'deg');
  $('#destination-marker').style.left=destination[0]+'px';$('#destination-marker').style.top=(destination[1]-10)+'px';
}
function updateCard(){
  $('#title').textContent=navigationDemo?navigationDemo.destination.name:'Navigation map';
  $('#summary').textContent=navigationDemo?`${navigationDemo.distance_m.toFixed(1)} m · Indoor route`:roomTitle;
  $('#navigate span').textContent=navigationDemo?(navigationActive?'End demo':'Start demo'):'Recenter';
  $('#status').textContent=navigationDemo?'Example route.':'Choose a destination in the app.';
  $('#navigation-banner').hidden=!navigationActive;
  $('#destination-name').textContent=navigationDemo?.destination.name||'';
}
function reset(){yaw=2.38;pitch=.61548;zoom=1;pan=[0,0];draw();}
function resize(){const rect=canvas.getBoundingClientRect(),dpi=Math.min(2,window.devicePixelRatio||1);width=rect.width;height=rect.height;canvas.width=Math.round(width*dpi);canvas.height=Math.round(height*dpi);gl.viewport(0,0,canvas.width,canvas.height);draw();}
new ResizeObserver(resize).observe(canvas);new ResizeObserver(()=>{if(scene)draw();}).observe($('#place-card'));
const pointers=new Map();let gesture;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);gesture=undefined;});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const previous=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){const[a,b]=[...pointers.values()],distance=Math.hypot(a[0]-b[0],a[1]-b[1]),mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];if(gesture){zoom=Math.max(.4,Math.min(3,zoom*distance/gesture.distance));pan=add(pan,sub(mid,gesture.mid));}gesture={distance,mid};}else if(e.shiftKey||is2D){pan=add(pan,[e.clientX-previous[0],e.clientY-previous[1]]);}else{yaw+=(e.clientX-previous[0])*.006;pitch=Math.max(.28,Math.min(1.22,pitch+(e.clientY-previous[1])*.004));}draw();});
for(const event of['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{pointers.delete(e.pointerId);gesture=undefined;});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','0','Escape'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.08;if(e.key==='ArrowRight')yaw+=.08;if(e.key==='ArrowUp')pitch=Math.min(1.22,pitch+.06);if(e.key==='ArrowDown')pitch=Math.max(.28,pitch-.06);if(e.key==='+'||e.key==='=')zoom=Math.min(3,zoom*1.1);if(e.key==='-')zoom=Math.max(.4,zoom/1.1);if(e.key==='0')reset();if(e.key==='Escape'){$('#layers').hidden=true;$('#layers-toggle').setAttribute('aria-expanded','false');}draw();});
$('#layers-toggle').addEventListener('click',()=>{const open=$('#layers').hidden;$('#layers').hidden=!open;$('#layers-toggle').setAttribute('aria-expanded',String(open));});$('#reset').addEventListener('click',reset);$('#north').addEventListener('click',()=>{yaw=2.38;draw();});$('#mode').addEventListener('click',()=>{is2D=!is2D;$('#mode').textContent=is2D?'3D':'2D';$('#mode').setAttribute('aria-label',is2D?'Show room in 3D':'Show room in 2D');pan=[0,0];draw();});$('#zoom-in').addEventListener('click',()=>{zoom=Math.min(3,zoom*1.2);draw();});$('#zoom-out').addEventListener('click',()=>{zoom=Math.max(.4,zoom/1.2);draw();});$('#overview').addEventListener('click',reset);$('#navigate').addEventListener('click',()=>{if(navigationDemo){navigationActive=!navigationActive;updateCard();}reset();});for(const control of[raw,bounds,walls])control.addEventListener('change',draw);
(async()=>{try{const id=decodeURIComponent(location.pathname.split('/')[2]),base=`/scans/${encodeURIComponent(id)}`;let headers={},response=await fetch(`${base}/scene`,{headers});if(response.status===401){const token=window.prompt('InView server access token');if(!token)throw new Error('An access token is required.');headers={Authorization:`Bearer ${token.trim()}`};response=await fetch(`${base}/scene`,{headers});}if(!response.ok)throw new Error(response.status===401?'Invalid access token.':'This room could not be loaded.');const source=await fetch(base,{headers});scene=await response.json();original=source.ok?await source.json():{};roomTitle=original.metadata?.title||original.metadata?.room_name||original.metadata?.room_title||original.metadata?.display_name||'Indoor map';if(typeof roomTitle!=='string')roomTitle='Indoor map';navigationDemo=readNavigationDemo(original.metadata);document.title='InView · Navigation';$('#source-note').textContent=original.metadata?.demo_only||original.metadata?.synthetic?'Demo':'Indoor map';if(!scene.objects.length&&!scene.surfaces.length)raw.checked=true;updateCard();fit();resize();}catch(error){$('#status').textContent=error.message;$('#summary').textContent='Room unavailable';}})();
</script>
