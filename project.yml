name: InView
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  AccessCore:
    path: Packages/AccessCore
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.32.0
targets:
  InView:
    type: application
    platform: iOS
    sources:
      - path: InView
    dependencies:
      - package: AccessCore
      - package: MapboxMaps
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: InView/Info.plist
      properties:
        CFBundleDisplayName: InView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: InView uses the camera and LiDAR to map buildings and guide you to accessible entrances, elevators and ramps.
        VisionProvider: $(VISION_PROVIDER)
        OPENAIAPIKey: $(OPENAI_API_KEY)
        OPENAIModel: $(OPENAI_MODEL)
        OPENAIReasoningEffort: $(OPENAI_REASONING_EFFORT)
        GeminiAPIKey: $(GEMINI_API_KEY)
        GeminiModel: $(GEMINI_MODEL)
        InViewBackendURL: $(INVIEW_BACKEND_URL)
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        NSLocationWhenInUseUsageDescription: InView uses your location to place a scanned building on the map.
        NSLocalNetworkUsageDescription: InView connects to your optional processing server to build the 3D view of your scan.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  InView:
    build:
      targets:
        InView: all
    run:
      config: Debug
      # RealityKit's own PBR shader (drawn by RoomCaptureView) trips Metal API Validation
      # with a tonemap LUT type mismatch, which crashes debug runs. Not our code.
      enableGPUValidationMode: disabled
    archive:
      config: Release
