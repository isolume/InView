name: InView
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  AccessCore:
    path: Packages/AccessCore
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.32.0
  MetalSplatter:
    url: https://github.com/scier/MetalSplatter.git
    exactVersion: 1.0.1
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    from: 2.22.0
targets:
  InView:
    type: application
    platform: iOS
    sources:
      - path: InView
        excludes:
          - Resources/StudentCenter/*.arworldmap
      # Preserve the original archive bytes; Copy Bundle Resources rewrites
      # binary property lists, including ARWorldMap's keyed archive.
      - path: InView/Resources/StudentCenter/student-center-east-floor-2.arworldmap
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - package: AccessCore
      - package: MapboxMaps
      - package: Auth0
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: InView/Info.plist
      properties:
        CFBundleDisplayName: InView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad runs full screen in any orientation, including Split View and Stage Manager windows.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: InView uses the camera and LiDAR to map buildings and guide you to accessible entrances, elevators and ramps.
        VisionProvider: $(VISION_PROVIDER)
        OPENAIAPIKey: $(OPENAI_API_KEY)
        OPENAIModel: $(OPENAI_MODEL)
        OPENAIReasoningEffort: $(OPENAI_REASONING_EFFORT)
        GeminiAPIKey: $(GEMINI_API_KEY)
        GeminiModel: $(GEMINI_MODEL)
        ElevenLabsAPIKey: $(ELEVENLABS_API_KEY)
        ElevenLabsVoiceID: $(ELEVENLABS_VOICE_ID)
        ElevenLabsModel: $(ELEVENLABS_MODEL)
        InViewBackendURL: $(INVIEW_BACKEND_URL)
        InViewAuth0Domain: $(INVIEW_AUTH0_DOMAIN)
        InViewAuth0ClientID: $(INVIEW_AUTH0_CLIENT_ID)
        InViewAuth0Callback: $(INVIEW_AUTH0_CALLBACK_URL)
        InViewBackendToken: $(INVIEW_BACKEND_TOKEN)
        InViewLocalBackendURL: $(INVIEW_LOCAL_BACKEND_URL)
        InViewUseLocalBackend: $(INVIEW_USE_LOCAL_BACKEND)
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        NSLocationWhenInUseUsageDescription: InView uses your location to place a scanned building on the map.
        NSMotionUsageDescription: InView uses elevation changes to suggest when you move to another floor while scanning.
        NSMicrophoneUsageDescription: InView listens when you tap the microphone, so you can ask where places are.
        NSSpeechRecognitionUsageDescription: InView turns your spoken question into text to find places in the building.
        NSContactsUsageDescription: InView matches your contacts’ email addresses, as one-way codes on your phone, to show which people you know chose to be found. Names and emails never leave your phone.
        NSLocalNetworkUsageDescription: InView connects to your optional processing server to build the 3D view of your scan.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Scans (and their splat photos) show in the Files app and in Finder, to copy to a Mac for training.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  InViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/InViewTests
    dependencies:
      - target: InView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vedanta.accessnav.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  InView:
    build:
      targets:
        InView: all
    run:
      config: Debug
      # RealityKit's own PBR shader (drawn by RoomCaptureView) trips Metal API Validation
      # with a tonemap LUT type mismatch, which crashes debug runs. Not our code.
      enableGPUValidationMode: disabled
    test:
      targets:
        - InViewTests
      enableGPUValidationMode: disabled
    archive:
      config: Release
