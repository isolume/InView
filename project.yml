name: AccessNav
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  AccessCore:
    path: Packages/AccessCore
targets:
  AccessNav:
    type: application
    platform: iOS
    sources:
      - path: AccessNav
    dependencies:
      - package: AccessCore
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: AccessNav/Info.plist
      properties:
        CFBundleDisplayName: AccessNav
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: AccessNav uses the camera and LiDAR to map buildings and guide you to accessible entrances, elevators and ramps.
        GeminiAPIKey: $(GEMINI_API_KEY)
        GeminiModel: $(GEMINI_MODEL)
        ElevenLabsAPIKey: $(ELEVENLABS_API_KEY)
        ElevenLabsVoiceID: $(ELEVENLABS_VOICE_ID)
        ElevenLabsModel: $(ELEVENLABS_MODEL)
        ServerHost: $(SERVER_HOST)
        ServerScheme: $(SERVER_SCHEME)
        NSAppTransportSecurity:
          # The demo server may run over plain HTTP on a laptop or a bare VPS IP.
          NSAllowsArbitraryLoads: true
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  AccessNav:
    build:
      targets:
        AccessNav: all
    run:
      config: Debug
      # RealityKit's own PBR shader (drawn by RoomCaptureView) trips Metal API Validation
      # with a tonemap LUT type mismatch, which crashes debug runs. Not our code.
      enableGPUValidationMode: disabled
    archive:
      config: Release
