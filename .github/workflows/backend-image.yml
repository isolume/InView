name: Backend image

# Builds backend/Dockerfile on every push to main and publishes it to GHCR.
# The Vultr instance polls this tag (inview-backend-update.timer) and restarts on a new digest.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - '!backend/infra/**'
      - .github/workflows/backend-image.yml
  workflow_dispatch:

concurrency:
  group: backend-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          build-args: CARGO_BUILD_JOBS=4
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inview-backend:latest
            ghcr.io/${{ github.repository_owner }}/inview-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
